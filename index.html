<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="text-scale" content="scale" />
    <meta name="theme-color" content="#f3f8fc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TT戰網" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Public+Sans:wght@400;500;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <title>TT戰網｜貿易署桌球社積分系統</title>
    <script>
      (function () {
        try {
          var key = 'precision-arena-theme';
          var stored = localStorage.getItem(key);
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = pref === 'dark' || (pref === 'system' && systemDark);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? '#050d1a' : '#f3f8fc');
          }
        } catch (e) {}
      })();
    </script>
    <style>body{margin:0;background:#f3f8fc;}html.dark body{background:#050d1a;}</style>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;">
        <img src="/brand/loading.svg" alt="TT戰網熱身開球中" width="600" height="420" style="width:100%;max-width:440px;height:auto;display:block;border-radius:28px;" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
